<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Trisian monoline icon set. 24 grid, 1.5px stroke, round caps and joins, no fills. Referenced with <use href="…/icons.svg#id">. -->
  <defs>
    <style>symbol *{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}</style>
  </defs>

  <!-- the desktop: a monitor with a session inside and a clean base -->
